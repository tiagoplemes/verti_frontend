<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verti — Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="tela-login">
    <div class="login-card card">
      <div class="login-marca">Verti</div>
      <div class="login-subtitulo">Gestão de Ordens de Serviço</div>

      <form id="form-login">
        <div class="campo">
          <label for="email">E-mail</label>
          <input class="input" type="email" id="email" required autocomplete="username" />
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input class="input" type="password" id="senha" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primario" id="btn-entrar" style="width: 100%;">Entrar</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
